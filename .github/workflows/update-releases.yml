name: Update release candidates

on:
  schedule:
    - cron: "25 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      RAWG_API_KEY: ${{ secrets.RAWG_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check current verified calendar
        run: npm run validate
      - name: Update RAWG candidate list
        if: ${{ env.RAWG_API_KEY != '' }}
        run: npm run update:candidates
      - name: Skip candidate update without RAWG key
        if: ${{ env.RAWG_API_KEY == '' }}
        run: echo "RAWG_API_KEY is not configured; verified calendar will still be validated and deployed."
      - name: Commit updated release data
        if: ${{ env.RAWG_API_KEY != '' }}
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Update candidate game releases
          file_pattern: data/candidate-releases.json
